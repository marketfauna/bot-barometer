name: Access reading (second vantage)

# Manual only. Runs the access-reading instrument from a GitHub-hosted runner, so a reading taken from
# our own network can be compared with one from a cloud address range. Unsigned: no key is present here.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Scope file under tools/reading/scopes/"
        required: true
        default: "v3-validation.json"

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests
        working-directory: tools/reading
        run: python -m unittest test_reading
      - name: Run the reading
        working-directory: tools/reading
        run: python reading.py run "scopes/${{ inputs.scope }}" --out out --vantage "a GitHub-hosted Actions runner (Microsoft Azure address range); not the operator's network"
      - uses: actions/upload-artifact@v4
        with:
          name: reading
          path: tools/reading/out/
