name: Weekly collection

on:
  schedule:
    - cron: "0 9 * * 1"   # every Monday 09:00 UTC
    - cron: "0 9 7 10 *"  # 2026-10-07 09:00 UTC (Wednesday): dated capture that resolves P8 and P13; remove after 2026-10-07
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect index series (data/)
        continue-on-error: true
        run: python tools/collect_index.py

      - name: Build feed.json
        continue-on-error: true
        run: python tools/build_feed.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Marketfauna Bot"
          git config user.email "hello@marketfauna.com"
          git add -A data watch feed.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Weekly collection $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
